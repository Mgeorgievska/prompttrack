name: PromptTrack CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Kubernetes access
        run: kubectl get nodes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: mgeorgievska/prompttrack-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: mgeorgievska/prompttrack-frontend:latest
          
      - name: Deploy backend to Kubernetes
        run: kubectl apply -f kubernetes/backend-deployment.yaml -n prompttrack

      - name: Deploy frontend to Kubernetes
        run: kubectl apply -f kubernetes/frontend-deployment.yaml -n prompttrack

      - name: Restart backend deployment
        run: kubectl rollout restart deployment/backend -n prompttrack

      - name: Restart frontend deployment
        run: kubectl rollout restart deployment/frontend -n prompttrack

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/backend -n prompttrack

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend -n prompttrack