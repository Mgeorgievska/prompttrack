apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: prompttrack

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: prompttrack-backend

          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          env:
            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_USER
              value: postgres

            - name: DB_PASSWORD
              value: postgres

            - name: DB_NAME
              value: prompttrack