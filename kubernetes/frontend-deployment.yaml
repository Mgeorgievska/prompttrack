apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: prompttrack

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: prompttrack-frontend

          imagePullPolicy: Never

          ports:
            - containerPort: 80