services:

  postgres:
    image: postgres:16
    container_name: prompttrack-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prompttrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5




  backend:
    build: ./backend
    container_name: prompttrack-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: prompttrack
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: prompttrack-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend


volumes:

  postgres_data: